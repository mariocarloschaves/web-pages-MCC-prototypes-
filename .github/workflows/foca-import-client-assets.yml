name: Foca Foca — import client assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/foca-import-client-assets.yml"

permissions:
  contents: write

concurrency:
  group: foca-foca-client-asset-import
  cancel-in-progress: false

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download client-supplied media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/foca-client
          curl -fL --retry 3 -o .tmp/foca-client/parmigiana.jpg "https://d2ol7oe51mr4n9.cloudfront.net/user_3IDQioFnKEdiBTSpvyKkSdi5fp9/5f8b1c34-62a2-40da-87c2-e93ee037bbfa.jpg"
          curl -fL --retry 3 -o .tmp/foca-client/mortadella.jpg "https://d2ol7oe51mr4n9.cloudfront.net/user_3IDQioFnKEdiBTSpvyKkSdi5fp9/3c67991d-bf01-4341-9e53-f7ade035d368.jpg"
          curl -fL --retry 3 -o .tmp/foca-client/messico.jpg "https://d2ol7oe51mr4n9.cloudfront.net/user_3IDQioFnKEdiBTSpvyKkSdi5fp9/153b5229-aefd-4694-89b7-4edf2f41a4bb.jpg"
          curl -fL --retry 3 -o .tmp/foca-client/napoli.jpg "https://d2ol7oe51mr4n9.cloudfront.net/user_3IDQioFnKEdiBTSpvyKkSdi5fp9/a2889b33-3054-437e-90b0-c3b1abb9d31b.jpg"
          curl -fL --retry 3 -o .tmp/foca-client/caprese.jpg "https://d2ol7oe51mr4n9.cloudfront.net/user_3IDQioFnKEdiBTSpvyKkSdi5fp9/e313837f-615a-4062-a895-04b039f26db6.jpg"
          curl -fL --retry 3 -o .tmp/foca-client/del-giorno.jpg "https://d2ol7oe51mr4n9.cloudfront.net/user_3IDQioFnKEdiBTSpvyKkSdi5fp9/56829fd3-234e-4f0b-99a6-0ddcae323f58.jpg"
          curl -fL --retry 3 -o .tmp/foca-client/story.jpg "https://d2ol7oe51mr4n9.cloudfront.net/user_3IDQioFnKEdiBTSpvyKkSdi5fp9/8a8d1b74-f8e3-4fc6-b6eb-b77387be1717.jpg"
          curl -fL --retry 3 -o .tmp/foca-client/camada.mp4 "https://d2ol7oe51mr4n9.cloudfront.net/user_3IDQioFnKEdiBTSpvyKkSdi5fp9/6ed9cc91-832b-4f63-8c03-0313a98b6959.mp4"
          test -s .tmp/foca-client/parmigiana.jpg
          test -s .tmp/foca-client/camada.mp4

      - name: Optimize client photography
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          source = Path(".tmp/foca-client")
          target = Path("public/foca-foca/images")
          target.mkdir(parents=True, exist_ok=True)

          jobs = {
              "parmigiana.jpg": ("dish-la-parmigiana.webp", 1600),
              "mortadella.jpg": ("dish-mortadella.webp", 1600),
              "messico.jpg": ("dish-messico-nuvole.webp", 1600),
              "napoli.jpg": ("dish-napoli.webp", 1600),
              "caprese.jpg": ("dish-caprese.webp", 1600),
              "del-giorno.jpg": ("dish-del-giorno.webp", 1600),
              "story.jpg": ("foca-02.webp", 1200),
          }

          for src_name, (dst_name, max_width) in jobs.items():
              image = ImageOps.exif_transpose(Image.open(source / src_name)).convert("RGB")
              if image.width > max_width:
                  new_height = round(image.height * max_width / image.width)
                  image = image.resize((max_width, new_height), Image.Resampling.LANCZOS)
              image.save(target / dst_name, "WEBP", quality=88, method=6)
          PY

      - name: Optimize and install Camada a camada video
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          mkdir -p public/foca-foca/media
          ffmpeg -hide_banner -loglevel error -y -i .tmp/foca-client/camada.mp4 \
            -vf "scale='min(720,iw)':-2" \
            -c:v libx264 -preset slow -crf 23 -pix_fmt yuv420p \
            -movflags +faststart -an public/foca-foca/media/camada-a-camada.mp4
          ffmpeg -hide_banner -loglevel error -y -ss 0.25 \
            -i public/foca-foca/media/camada-a-camada.mp4 \
            -frames:v 1 -q:v 3 public/foca-foca/media/camada-a-camada-poster.jpg

      - name: Regenerate bilingual pages from maintained source
        run: python scripts/foca-bilingual.py

      - name: Verify mapped client update
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          pt = Path("public/foca-foca/index.html").read_text()
          en = Path("public/foca-foca/en.html").read_text()

          removed = [
              "Cornetto simples",
              "Cornetto recheado",
              "Sfogliatella napolitana",
              "Cappuccino com pistáchio",
          ]
          for item in removed:
              assert item not in pt, item

          for item in ["Cynar Spritz", "Estrella Bock Damm", "Barbera d’Alba"]:
              assert item in pt, item
              assert item in en, item

          assert "./media/camada-a-camada.mp4" in pt
          assert "./media/camada-a-camada.mp4" in en

          expected = [
              "dish-la-parmigiana.webp",
              "dish-mortadella.webp",
              "dish-messico-nuvole.webp",
              "dish-napoli.webp",
              "dish-caprese.webp",
              "dish-del-giorno.webp",
              "foca-02.webp",
          ]
          for filename in expected:
              p = Path("public/foca-foca/images") / filename
              assert p.exists() and p.stat().st_size > 20_000, filename

          video = Path("public/foca-foca/media/camada-a-camada.mp4")
          assert video.exists() and video.stat().st_size > 100_000
          PY

      - name: Commit finalized Foca Foca client update
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp
          git rm .github/workflows/foca-import-client-assets.yml
          git config user.name "MCC Automation"
          git config user.email "mccaiteamsupport@gmail.com"
          git add public/foca-foca scripts/foca-bilingual.py
          git commit -m "Finalize Foca Foca client photos, menu and assembly video"
          git push origin HEAD:main
