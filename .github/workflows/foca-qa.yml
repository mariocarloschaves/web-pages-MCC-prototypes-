name: Foca Foca preview QA
on:
  push:
    branches: [main, 'foca-foca/**']
    paths:
      - 'public/foca-foca/**'
      - 'scripts/foca-bilingual.py'
      - 'scripts/qa/foca-foca.py'
      - '.github/workflows/foca-qa.yml'
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy MCC Prototypes]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QA tools
        run: |
          python -m pip install Pillow==11.3.0 playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Verify generator is reproducible
        run: |
          python scripts/foca-bilingual.py
          git diff --exit-code -- public/foca-foca/index.html public/foca-foca/en.html
          python scripts/foca-bilingual.py
          git diff --exit-code -- public/foca-foca/index.html public/foca-foca/en.html
      - name: Test both languages and responsive media
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            export BASE_URL=https://mariocarloschaves.github.io/web-pages-MCC-prototypes-/foca-foca/
          else
            python -m http.server 4173 --directory public > /tmp/foca-server.log 2>&1 &
          fi
          python scripts/qa/foca-foca.py
      - name: Save screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foca-foca-qa
          path: qa/foca-foca/
